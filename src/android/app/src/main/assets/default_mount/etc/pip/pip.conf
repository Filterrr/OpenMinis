# Debian 12 (bookworm) marks its system Python EXTERNALLY-MANAGED (PEP 668), so
# `pip install` outside a venv refuses to run unless --break-system-packages is
# passed. The sandbox has no venv and installs into the system Python, so set the
# flag globally here instead of relying on every caller to pass it.
[global]
break-system-packages = true
